[package]
name = "og"
description = "OwnGenome's one binary: og <tool> [args]"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pycompat.workspace = true
og-io.workspace = true
og-bam = { workspace = true, optional = true }
og-map.workspace = true
og-intervals.workspace = true
og-clinvar.workspace = true
og-dev.workspace = true
og-qc.workspace = true
og-pgx.workspace = true
og-vcf.workspace = true
og-steps.workspace = true
og-filters.workspace = true
og-setup.workspace = true
og-chip.workspace = true
og-cn.workspace = true
og-bloodtype.workspace = true
og-reports.workspace = true
og-runlog.workspace = true
og-ancestry.workspace = true
og-summary.workspace = true
og-lookup.workspace = true
og-fresh.workspace = true
og-recheck.workspace = true

[features]
# BAM reading (og-bam, on a statically linked htslib written in C) is on by
# default, so every Linux build has it. The macOS build for a live host
# (rust/og.sh, docs/rust.md) leaves it out with --no-default-features: the
# live site needs `og map`, never a BAM, and htslib's C would otherwise have
# to cross-compile for Apple.
default = ["bam"]
bam = ["dep:og-bam"]

# musl's own malloc lets a long multi-threaded read grow to several times
# its live data (step 40 on a 550 MB gVCF: 160-300 MB, against 40 MB with
# glibc); mimalloc keeps the release builds at their live size.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["no_thp"] }

[lints]
workspace = true
